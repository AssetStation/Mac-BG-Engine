name: Build Mac Executables (Intel x86_64 & Apple Silicon)

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual run button in GitHub Actions UI

jobs:
  # =========================================================================
  # 1. INTEL MAC BUILD (x86_64 compiled via Rosetta on modern Mac runner)
  # =========================================================================
  build-intel-x86_64:
    runs-on: macos-latest # Uses available Apple Silicon runner with Rosetta translation
    steps:
    - uses: actions/checkout@v4

    - name: Enable Rosetta 2
      run: |
        softwareupdate --install-rosetta --agree-to-license || true

    - name: Set up Python (x64)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: 'x64'

    - name: Verify Architecture
      run: |
        python -c "import platform; print('Active Python Machine:', platform.machine(), platform.architecture())"

    - name: Install dependencies (x64)
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Compile Intel Executable
      run: |
        pyinstaller --onefile --name bg_engine_x86_64 bg_engine.py
        chmod +x dist/bg_engine_x86_64
        file dist/bg_engine_x86_64 # Prints architecture to verify x86_64

    - name: Upload Intel Mac Executable
      uses: actions/upload-artifact@v4
      with:
        name: bg_engine_x86_64
        path: dist/bg_engine_x86_64

  # =========================================================================
  # 2. APPLE SILICON BUILD (arm64)
  # =========================================================================
  build-apple-silicon-arm64:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python (arm64)
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        architecture: 'arm64'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Compile Apple Silicon Executable
      run: |
        pyinstaller --onefile --name bg_engine bg_engine.py
        chmod +x dist/bg_engine
        file dist/bg_engine # Prints architecture to verify arm64

    - name: Upload Apple Silicon Executable
      uses: actions/upload-artifact@v4
      with:
        name: bg_engine_arm64
        path: dist/bg_engine
